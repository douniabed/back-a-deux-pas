# =============================================================================
# APPLICATION PROFILE CONFIGURATION EXAMPLE
# =============================================================================
# This is a template file for creating new Spring Boot profiles
# Copy this file to application-{profile}.properties and customize as needed
#
# Usage:
#   1. Copy: cp application-example.properties application-myprofile.properties
#   2. Replace placeholders with actual values
#   3. Add to .gitignore if it contains secrets
#   4. Use with: -Dspring.profiles.active=myprofile or mvn -P{profile}
#
# IMPORTANT:
#   - Use environment variables for secrets: ${ENV_VAR:default_value}
#   - Never commit files with real secrets to version control
#   - Store sensitive files securely (Nexus, Jenkins credentials, vault, etc.)
# =============================================================================

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
# MySQL/MariaDB connection settings
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/database_name?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Europe/Paris&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:your_db_username}
spring.datasource.password=${DB_PASSWORD:your_db_password}

# =============================================================================
# JPA / HIBERNATE CONFIGURATION
# =============================================================================
# Schema management options: update, create, create-drop, validate, none
# - update: Updates schema on startup (recommended for dev)
# - create-drop: Drops and recreates on each startup (useful for testing)
# - validate: Only validates schema, doesn't modify (recommended for prod)
# - none: No schema management
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (disable in production for performance)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# JWT CONFIGURATION
# =============================================================================
# JWT secret key - MUST be replaced with a strong random secret in production
# Generate with: openssl rand -base64 64
# Or: head -c 64 /dev/urandom | base64
app.jwt.secret=${JWT_SECRET:REPLACE_WITH_STRONG_RANDOM_SECRET_AT_LEAST_64_CHARS}

# =============================================================================
# CLOUDINARY CONFIGURATION (Image Storage)
# =============================================================================
# Sign up at https://cloudinary.com to get these credentials
cloudinary.url=${CLOUDINARY_URL:https://res.cloudinary.com/YOUR_CLOUD_NAME/image/upload/}
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api_key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:your_api_secret}

# =============================================================================
# STRIPE CONFIGURATION (Payment Processing)
# =============================================================================
# Get from https://dashboard.stripe.com/apikeys
# Use test keys (sk_test_*) for dev, live keys (sk_live_*) for production
stripe.api.key=${STRIPE_API_KEY:sk_test_your_stripe_api_key}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret}

# =============================================================================
# SEED DATA CONFIGURATION (DEV/TEST ONLY)
# =============================================================================
# Passwords for seeded test users - REMOVE in production!
first.pass=${SEED_PASSWORD_1:password1}
second.pass=${SEED_PASSWORD_2:password2}
third.pass=${SEED_PASSWORD_3:password3}
fourth.pass=${SEED_PASSWORD_4:password4}
fifth.pass=${SEED_PASSWORD_5:password5}
sixth.pass=${SEED_PASSWORD_6:password6}
seventh.pass=${SEED_PASSWORD_7:password7}
eighth.pass=${SEED_PASSWORD_8:password8}

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
# Logging levels: TRACE, DEBUG, INFO, WARN, ERROR, FATAL, OFF
# Application logs
logging.level.adeuxpas.back=INFO

# Hibernate SQL logs
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Spring framework logs
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

